<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detetive de Bolso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;--txt:#e9ebf0;--mut:#9aa1ae;--me:#2f6df6;--acc:#f2b84b;--ok:#3ecf8e;--bad:#ff6b6b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;justify-content:center}
  button,input{font-family:inherit}
  .app{width:100%;max-width:480px;height:100dvh;position:relative;overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .28s ease}
  .screen.off{transform:translateX(100%);visibility:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:62px}
  .back{background:var(--panel2);border:1px solid var(--line);color:var(--txt);font:600 13px Inter;cursor:pointer;padding:8px 12px;border-radius:999px;white-space:nowrap}
  .navbar{display:flex;gap:8px;margin-bottom:10px}
  .navbar button{flex:1;min-width:0;justify-content:center;padding:12px;font-size:14px;overflow:hidden;text-overflow:ellipsis}
  .navbar .go-chat{background:var(--me);border-color:var(--me);color:#fff}
  .avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--panel2)}
  .avatar svg,.avatar img{width:100%;height:100%;display:block;object-fit:cover}
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{color:var(--mut);font-size:12px}
  .who small.typing{color:var(--acc)}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 11px;font:600 13px Inter;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
  .pill .n{background:var(--acc);color:#2b1a05;border-radius:999px;padding:1px 7px;font-size:12px}
  .pill.on{background:var(--acc);color:#2b1a05}
  .timer{font:600 12px 'JetBrains Mono',monospace;color:var(--acc)}
  .chat{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:6px}
  .msg,.ev,.photo,.dots,.end,.day{flex-shrink:0}
  .day{align-self:center;font-size:11px;color:var(--mut);background:var(--panel);padding:4px 10px;border-radius:999px;margin-bottom:6px}
  .msg{max-width:82%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.4;animation:pop .18s ease-out}
  .msg.in{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
  .msg.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
  .msg.note{align-self:center;background:none;color:var(--mut);font-size:12px;font-style:italic;text-align:center}
  .ev{align-self:flex-start;max-width:86%;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:10px 12px;animation:pop .18s ease-out}
  .ev .t{font-size:12px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .ev .c{font-size:14px;line-height:1.45;white-space:pre-line}
  .ev .c.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#0b0d11;border-radius:8px;padding:8px}
  .photo{align-self:flex-start;width:78%;border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative;animation:pop .18s ease-out}
  .photo svg{display:block;width:100%;height:auto}
  .photo span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .dots{align-self:flex-start;background:var(--panel2);border-radius:16px;padding:12px 14px;display:flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-3px)}}
  .bottom{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
  .tools{display:flex;gap:8px;margin-bottom:10px}
  .tools .pill{flex:1;justify-content:center}
  .tools .pill:disabled{opacity:.35;cursor:not-allowed}
  .choices{display:flex;flex-direction:column;gap:8px;min-height:44px;max-height:40vh;overflow-y:auto}
  .choice{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 14px;text-align:left;font:500 14px Inter;cursor:pointer}
  .choice:hover,.choice:focus-visible{border-color:var(--me);outline:none}
  .choice.main{background:var(--acc);color:#2b1a05;border-color:var(--acc);font-weight:700}
  .choice.alt{border-color:#6b4fd8;color:#cbbdff}
  .hint{color:var(--mut);font-size:12px;text-align:center;padding:4px}
  /* home */
  .home-b{flex:1;overflow-y:auto;padding:14px 12px 24px;display:flex;flex-direction:column;gap:10px}
  .hero{padding:4px 4px 8px}
  .hero h1{font-size:22px;font-weight:800}
  .hero p{color:var(--mut);font-size:13px;margin-top:2px}
  .card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;color:var(--txt);width:100%}
  .card:hover{border-color:var(--acc)}
  .card .ico{width:54px;height:54px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-size:28px;flex-shrink:0}
  .card .info{flex:1;min-width:0}
  .card b{display:block;font-size:15px}
  .card small{display:block;color:var(--mut);font-size:12.5px;line-height:1.35;margin-top:2px}
  .card .meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--mut);flex-wrap:wrap}
  .tag{background:var(--panel2);border-radius:999px;padding:2px 8px}
  .tag.ok{background:rgba(62,207,142,.15);color:var(--ok)}
  .tag.go{background:rgba(242,184,75,.15);color:var(--acc)}
  /* cena */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px;gap:12px;overflow:auto;background:#07080b}
  .stage svg{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);touch-action:manipulation}
  .hs{cursor:pointer;outline:none}.hs rect.hit{fill:transparent}
  .hs .mark{opacity:0;transition:opacity .2s}.hs.found .mark{opacity:1}
  .sceneInfo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:72px;font-size:14px;line-height:1.45}
  .sceneInfo b{color:var(--acc)}
  .prog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
  .tap{fill:none;stroke:rgba(242,184,75,.9);stroke-width:2;animation:ring .7s ease-out forwards;pointer-events:none}
  @keyframes ring{from{r:4;opacity:1}to{r:26;opacity:0}}
  .blink{animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.25}}
  /* contatos */
  .contacts{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
  .contact{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--txt)}
  .contact .avatar{width:54px;height:54px}
  .contact b{display:block}.contact small{color:var(--mut);font-size:13px}
  /* ranking */
  .seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px;margin:12px 12px 0}
  .seg button{flex:1;background:none;border:none;color:var(--mut);padding:9px;border-radius:9px;font:600 13px Inter;cursor:pointer}
  .seg button.sel{background:var(--panel);color:var(--txt)}
  .seg button:disabled{opacity:.4;cursor:not-allowed}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}
  .chips button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:7px 12px;font:600 13px Inter;cursor:pointer;white-space:nowrap}
  .chips button.sel{border-color:var(--acc);color:var(--acc)}
  .rank{flex:1;overflow-y:auto;padding:0 12px 20px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .row.me{border-color:var(--me)}
  .row .pos{width:28px;text-align:center;font-weight:800;font-size:16px}
  .row .nm{flex:1;min-width:0}.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm small{color:var(--mut);font-size:12px}
  .row .st{font-size:13px;text-align:right}.row .st small{display:block;color:var(--mut);font:500 12px 'JetBrains Mono',monospace}
  /* sheet */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:30}
  .overlay.open{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;z-index:31}
  .sheet.open{transform:none}
  .sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px;gap:10px}
  .sheet-h h2{font-size:17px}
  .x{background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer;padding:2px 8px}
  .sheet-b{overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:10px}
  .sheet-b .ev{max-width:100%;align-self:stretch;animation:none}
  .ev.pick{cursor:pointer}.ev.pick:hover{border-color:var(--me)}
  .sus{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sus button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px 8px;font:600 14px Inter;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
  .sus button .avatar{width:64px;height:64px}
  .sus button small{color:var(--mut);font-weight:400;font-size:12px}
  .sus button:hover{border-color:var(--acc)}
  .empty{color:var(--mut);font-size:14px;text-align:center;padding:20px}
  .restart{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px;font:500 13px Inter;cursor:pointer}
  .field{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:16px}
  .field:focus{outline:none;border-color:var(--acc)}
  .toast{position:absolute;top:72px;left:50%;transform:translate(-50%,-20px);background:var(--acc);color:#2b1a05;font:600 13px Inter;padding:8px 14px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:40;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .end{align-self:center;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0;max-width:92%}
  .end b{display:block;font-size:16px;margin-bottom:4px}
  .end.ok b{color:var(--ok)}.end.bad b{color:var(--bad)}.end.mid b{color:var(--acc)}
  .end p{color:var(--mut);font-size:13px;line-height:1.4}
</style>
</head>
<body>
<div class="app">

  <!-- INÍCIO -->
  <section class="screen" id="home">
    <header>
      <div class="who"><b>🕵️ Detetive de Bolso</b><small id="playerLbl">Jogador: —</small></div>
      <button class="pill" id="btnPlayer">✎ Trocar</button>
      <button class="pill" id="btnRank">🏆</button>
    </header>
    <div class="home-b">
      <div class="hero"><h1>Escolha um caso</h1><p>Ranking: mais estrelas primeiro, depois o menor tempo. Acusação errada soma 1 min.</p></div>
      <div id="caseList" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </section>

  <!-- CONVERSA PRINCIPAL -->
  <section class="screen off" id="main">
    <header>
      <button class="back" id="toHome" aria-label="Voltar aos casos">‹ Casos</button>
      <div class="avatar" id="mainAv"></div>
      <div class="who"><b id="mainName"></b><small id="st-main">online</small></div>
      <span class="timer" id="timer">00:00</span>
      <button class="pill" id="turbo" aria-label="Acelerar mensagens">⏩</button>
      <button class="pill" id="openEv">🔎 <span class="n" id="evCount">0</span></button>
    </header>
    <div class="chat" id="chat-main"></div>
    <div class="bottom">
      <div class="tools">
        <button class="pill" id="btnScene" disabled>📷 Examinar cena</button>
        <button class="pill" id="btnInter" disabled>🗣️ Interrogar</button>
      </div>
      <div class="choices" id="ch-main"></div>
    </div>
  </section>

  <!-- CENA -->
  <section class="screen off" id="scene">
    <header>
      <button class="back" data-back="main" aria-label="Voltar pra conversa">‹ Conversa</button>
      <div class="who"><b id="sceneTitle"></b><small id="sceneCount"></small></div>
    </header>
    <div class="stage">
      <div id="sceneSvg"></div>
      <div class="prog"><i id="sceneProg"></i></div>
      <div class="sceneInfo" id="sceneInfo"></div>
    </div>
    <div class="bottom"><div class="navbar"><button class="pill go-chat" data-back="main"></button></div></div>
  </section>

  <!-- SUSPEITOS -->
  <section class="screen off" id="contacts">
    <header>
      <button class="back" data-back="main" aria-label="Voltar pra conversa">‹ Conversa</button>
      <div class="who"><b>Interrogatório</b><small>Escolha com quem falar</small></div>
    </header>
    <div class="contacts" id="contactList"></div>
    <div class="bottom"><div class="navbar"><button class="pill go-chat" data-back="main"></button></div></div>
  </section>

  <!-- INTERROGATÓRIO -->
  <section class="screen off" id="inter">
    <header>
      <button class="back" data-back="contacts" aria-label="Voltar aos suspeitos">‹ Suspeitos</button>
      <div class="avatar" id="interAv"></div>
      <div class="who"><b id="interName"></b><small id="st-inter">online</small></div>
      <button class="pill" id="openEv2">🔎</button>
    </header>
    <div class="chat" id="chat-inter"></div>
    <div class="bottom">
      <div class="navbar"><button class="pill" data-back="contacts">👥 Outros suspeitos</button><button class="pill go-chat" data-back="main"></button></div>
      <div class="choices" id="ch-inter"></div></div>
  </section>

  <!-- RANKING -->
  <section class="screen off" id="ranking">
    <header>
      <button class="back" data-back="home" aria-label="Voltar aos casos">‹ Casos</button>
      <div class="who"><b>🏆 Ranking</b><small id="rankSub">Mais estrelas, depois menor tempo</small></div>
    </header>
    <div class="seg"><button id="segLocal" class="sel">Neste aparelho</button><button id="segOnline">Online</button></div>
    <div class="chips" id="rankChips"></div>
    <div class="rank" id="rankList"></div>
  </section>

  <div class="overlay" id="ov"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="x" id="closeSheet" aria-label="Fechar">×</button></div>
    <div class="sheet-b" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

const $=id=>document.getElementById(id);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const stars=n=>"⭐".repeat(n)+"☆".repeat(3-n);

let C=null, S=null, busy=false, speed=1, turbo=false, interWho=null, ACC={};
let player=store.get("dp-player",null);
const wait=ms=>new Promise(r=>setTimeout(r,ms*speed*(turbo?.25:1)));
const tms=t=>Math.min(300+t.length*9,950);

/* ---------- retratos desenhados ---------- */
function drawFace(f,k){
  const H=f.hair||"#222";let back="",front="";
  switch(f.style){
    case"curly":back=`<circle cx="50" cy="40" r="30" fill="${H}"/><circle cx="26" cy="56" r="13" fill="${H}"/><circle cx="74" cy="56" r="13" fill="${H}"/>`;front=`<path d="M26 44 Q30 22 50 22 Q70 22 74 44 Q62 30 50 32 Q38 30 26 44Z" fill="${H}"/>`;break;
    case"long":back=`<path d="M22 50 Q20 16 50 16 Q80 16 78 50 L82 88 L18 88Z" fill="${H}"/>`;front=`<path d="M24 48 Q26 20 50 20 Q74 20 76 48 Q66 30 50 31 Q34 30 24 48Z" fill="${H}"/>`;break;
    case"pony":back=`<path d="M70 28 Q94 40 84 74 Q78 52 70 44Z" fill="${H}"/>`;front=`<path d="M24 48 Q26 20 50 20 Q74 20 76 48 Q66 30 50 30 Q34 30 24 48Z" fill="${H}"/>`;break;
    case"short":front=`<path d="M24 46 Q26 18 50 18 Q76 18 76 46 Q70 30 50 30 Q32 30 24 46Z" fill="${H}"/>`;break;
    case"buzz":front=`<path d="M26 44 Q28 22 50 22 Q72 22 74 44 Q64 32 50 32 Q36 32 26 44Z" fill="${H}"/>`;break;
    case"bun":back=`<circle cx="50" cy="16" r="11" fill="${H}"/>`;front=`<path d="M24 50 Q22 22 50 22 Q78 22 76 50 Q70 32 50 32 Q30 32 24 50Z" fill="${H}"/>`;break;
    case"bald":front=`<path d="M27 52 Q25 42 29 38M73 52 Q75 42 71 38" stroke="${H}" stroke-width="5" fill="none" stroke-linecap="round"/>`;break;
  }
  const pin=f.pin?`<path d="M54 8 L66 3" stroke="#f4f4fa" stroke-width="2.4" stroke-linecap="round"/>`:"";
  const cap=f.cap?`<path d="M25 40 Q27 16 50 16 Q73 16 75 40Z" fill="${f.cap}"/><rect x="48" y="36" width="34" height="6" rx="3" fill="${f.cap}"/>`:"";
  const band=f.headband?`<path d="M25 36 Q50 22 75 36" stroke="${f.headband}" stroke-width="5" fill="none"/>`:"";
  const beard=f.beard?`<path d="M32 58 Q34 82 50 84 Q66 82 68 58 Q62 70 50 70 Q38 70 32 58Z" fill="${H}" opacity=".85"/>`:"";
  const must=f.mustache?`<path d="M40 61 Q50 55 60 61 Q50 63 40 61Z" fill="${H}"/>`:"";
  const gl=f.glasses?`<g fill="none" stroke="#333" stroke-width="2"><circle cx="40" cy="50" r="7"/><circle cx="60" cy="50" r="7"/><path d="M47 50h6"/></g>`:"";
  const ear=f.earrings?`<circle cx="26" cy="60" r="2.6" fill="${f.earrings}"/><circle cx="74" cy="60" r="2.6" fill="${f.earrings}"/>`:"";
  const num=f.num?`<text x="50" y="97" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="#fff" stroke="#000" stroke-opacity=".25">${f.num}</text>`:"";
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${k}"><rect width="100" height="100" fill="${f.bg}"/>${back}${pin}
  <path d="M14 100 Q16 78 50 76 Q84 78 86 100Z" fill="${f.shirt||"#2a2f3a"}"/><rect x="43" y="64" width="14" height="13" fill="${f.skin}"/>
  <ellipse cx="50" cy="50" rx="24" ry="27" fill="${f.skin}"/>${front}${cap}${band}
  <circle cx="40" cy="50" r="2.6" fill="#1a1a1a"/><circle cx="60" cy="50" r="2.6" fill="#1a1a1a"/>${gl}${beard}${must}
  <path d="M42 66 Q50 ${f.lipstick?71:70} 58 66 Q50 68 42 66Z" fill="${f.lips}" stroke="${f.lips}" stroke-width="${f.lipstick?2.4:1}"/>${ear}${num}</svg>`;
}
function face(k,c=C){const p=c.photos&&c.photos[k];return p?`<img src="${p}" alt="${k}">`:drawFace(c.faces[k],k)}

/* ---------- cena ---------- */
function sceneSVG(full=true){
  const hs=!full?"":Object.entries(C.scene.hs).map(([k,h])=>`<g class="hs" data-hs="${k}" tabindex="0" role="button" aria-label="${k}">
    <rect class="hit" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}"/>
    <g class="mark"><circle cx="${h.x+h.w-6}" cy="${h.y+6}" r="9" fill="#f2b84b"/><path d="M${h.x+h.w-10} ${h.y+6}l3 3 5-6" stroke="#2b1a05" stroke-width="2.2" fill="none"/></g></g>`).join("");
  return `<svg viewBox="0 0 360 300" ${full?'id="sceneEl"':""}><defs><radialGradient id="vig${full?1:0}" cx="55%" cy="45%" r="70%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs>
  ${C.scene.art}<rect width="360" height="300" fill="url(#vig${full?1:0})" pointer-events="none"/>${hs}</svg>`;
}
const hsCount=()=>Object.keys(C.scene.hs).length;
function bindScene(){
  const svg=$("sceneEl");
  svg.querySelectorAll(".hs").forEach(g=>{
    const k=g.dataset.hs,h=C.scene.hs[k];
    const act=()=>{
      ring(h.x+h.w/2,h.y+h.h/2);$("sceneInfo").innerHTML=h.txt;
      if(S.found.has(k))return;
      S.found.add(k);g.classList.add("found");
      if(h.ev)gain(h.ev);
      if(h.flag){S.flags.add(h.flag);toast("Nova pergunta liberada")}
      updateScene();save();
    };
    g.addEventListener("click",act);g.addEventListener("keydown",e=>{if(e.key==="Enter")act()});
  });
  svg.addEventListener("click",e=>{
    if(e.target.closest(".hs"))return;
    const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());
    ring(q.x,q.y);$("sceneInfo").innerHTML="Nada de importante aqui. Continue procurando.";
  });
}
function ring(x,y){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",4);c.setAttribute("class","tap");$("sceneEl").appendChild(c);setTimeout(()=>c.remove(),700)}
function updateScene(){const n=S.found.size,t=hsCount();$("sceneCount").textContent=`${n}/${t} detalhes encontrados`;$("sceneProg").style.width=(n/t*100)+"%"}

/* ---------- estado e salvamento ---------- */
const saveKey=()=>`dp-save-${player}-${C.id}`;
function newState(){
  S={visited:new Set(),ev:[],flags:new Set(),found:new Set(),asked:{},logs:{},elapsed:0,penalty:0,ended:false};
  Object.keys(C.sus).forEach(k=>{S.asked[k]=new Set();S.logs[k]=el("div");S.logs[k].style.display="contents"});
}
function save(){
  if(busy||!S||!C)return;
  const logs={};Object.keys(S.logs).forEach(k=>logs[k]=S.logs[k].innerHTML);
  store.set(saveKey(),{visited:[...S.visited],ev:S.ev,flags:[...S.flags],found:[...S.found],ended:S.ended,elapsed:S.elapsed,penalty:S.penalty,
    asked:Object.fromEntries(Object.entries(S.asked).map(([k,v])=>[k,[...v]])),main:$("chat-main").innerHTML,logs,
    scene:!$("btnScene").disabled,inter:!$("btnInter").disabled});
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
window.addEventListener("pagehide",save);

/* ---------- cronômetro (só conta com o caso aberto e a tela visível) ---------- */
setInterval(()=>{
  if(!S||S.ended||!C||document.hidden||!$("home").classList.contains("off")||!$("ranking").classList.contains("off"))return;
  S.elapsed+=1000;$("timer").textContent=fmt(S.elapsed+S.penalty);
  if(S.elapsed%10000===0)save();
},1000);

/* ---------- abrir caso ---------- */
function openCase(id,fresh){
  C=CASES.find(c=>c.id===id);
  $("mainAv").innerHTML=face(C.contact.k);$("mainName").textContent=C.contact.name;
  const cn=C.contact.name.split(" · ")[0];document.querySelectorAll(".go-chat").forEach(b=>b.textContent=b.closest("#inter")?"💬 Voltar pra "+cn:"💬 Voltar pra conversa com "+cn);
  $("sceneTitle").textContent=C.scene.title;
  const d=fresh?null:store.get(saveKey(),null);
  newState();
  $("sceneSvg").innerHTML=sceneSVG();bindScene();
  $("sceneInfo").innerHTML="Toque nos objetos da foto para examinar. Procure qualquer coisa fora do lugar.";
  if(d&&d.main){
    d.visited.forEach(v=>S.visited.add(v));S.ev=d.ev;d.flags.forEach(f=>S.flags.add(f));S.ended=d.ended;S.elapsed=d.elapsed||0;S.penalty=d.penalty||0;
    Object.entries(d.asked).forEach(([k,v])=>v.forEach(q=>S.asked[k]&&S.asked[k].add(q)));
    Object.entries(d.logs).forEach(([k,h])=>{if(S.logs[k])S.logs[k].innerHTML=h});
    $("chat-main").innerHTML=d.main;$("chat-main").querySelectorAll(".photo").forEach(p=>p.onclick=()=>go("scene"));
    d.found.forEach(k=>{S.found.add(k);const g=document.querySelector(`#sceneEl [data-hs="${k}"]`);if(g)g.classList.add("found")});
    $("btnScene").disabled=!d.scene;$("btnInter").disabled=!d.inter;
    updateScene();updateCount();$("timer").textContent=fmt(S.elapsed+S.penalty);
    go("main");scroll($("chat-main"));renderHub();
  }else{
    store.del(saveKey());
    $("chat-main").innerHTML=`<div class="day">${C.day}</div>`;
    $("btnScene").disabled=true;$("btnInter").disabled=true;
    updateScene();updateCount();$("timer").textContent="00:00";
    go("main");play("start");
  }
}

/* ---------- navegação ---------- */
function go(id){["home","main","scene","contacts","inter","ranking"].forEach(s=>$(s).classList.toggle("off",s!==id&&!(id!=="home"&&id!=="ranking"&&s==="main")));}
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{
  const to=b.dataset.back;
  if(to==="contacts")renderContacts();
  if(to==="home")renderHome();
  go(to);if(to==="main")renderHub();
});
$("toHome").onclick=()=>{save();renderHome();go("home")};

/* ---------- chat ---------- */
function scroll(c){c.scrollTop=c.scrollHeight}
function add(chatId,e){const c=$(chatId);(chatId==="chat-inter"?S.logs[interWho]:c).appendChild(e);scroll(c);return e}
function bubble(chatId,cls,html){return add(chatId,el("div","msg "+cls,html))}
function evCard(id,extra=""){const e=C.ev[id];return el("div","ev "+extra,`<div class="t">${e.t}</div><div class="c ${e.mono?"mono":""}">${e.c}</div>`)}
async function typing(chatId,stId,ms){
  const st=$(stId);st.textContent="digitando…";st.className="typing";
  const d=add(chatId,el("div","dots","<i></i><i></i><i></i>"));
  await wait(ms);d.remove();st.textContent="online";st.className="";
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove("show"),1900)}
function gain(id){if(S.ev.includes(id))return;S.ev.push(id);updateCount();toast("Nova pista: "+C.ev[id].t.replace(/^\S+\s/,""))}
function updateCount(){$("evCount").textContent=S?S.ev.length:0}
["chat-main","chat-inter"].forEach(id=>$(id).addEventListener("click",()=>{if(busy)speed=.15}));
const cname=()=>C.contact.name.split(" · ")[0];

async function play(nodeId){
  busy=true;$("ch-main").innerHTML='<div class="hint">toque na conversa para acelerar</div>';
  const n=C.nodes[nodeId];S.visited.add(nodeId);
  for(const m of n.msgs){
    if(m.b){await typing("chat-main","st-main",tms(m.b));bubble("chat-main","in",m.b);await wait(120)}
    if(m.ev){await typing("chat-main","st-main",450);add("chat-main",evCard(m.ev));gain(m.ev);await wait(300)}
    if(m.photo){await typing("chat-main","st-main",700);const p=el("div","photo",sceneSVG(false)+"<span>📷 Toque para examinar</span>");p.onclick=()=>go("scene");add("chat-main",p);await wait(250)}
  }
  (n.unlock||[]).forEach(u=>{if(u==="scene")$("btnScene").disabled=false;if(u==="inter")$("btnInter").disabled=false});
  speed=1;busy=false;
  if(n.choices)renderChoices("ch-main",n.choices);else renderHub();
}
function renderChoices(elId,list){
  setTimeout(save,0);
  const box=$(elId);box.innerHTML="";
  list.forEach(c=>{const b=el("button","choice "+(c.cls||"")+(c.main?" main":""));b.textContent=c.l;
    b.onclick=()=>{if(busy)return;if(!c.silent)bubble(elId==="ch-main"?"chat-main":"chat-inter","me",c.l);c.fn?c.fn():play(c.to)};box.appendChild(b)});
}
function ok(r){if(r.startsWith("f:"))return S.flags.has(r.slice(2));if(r.startsWith("e:"))return S.ev.includes(r.slice(2));return S.visited.has(r)}
function renderHub(){
  if(busy||!S)return;
  if(S.ended){renderChoices("ch-main",[{l:"🏆 Ver ranking",silent:true,fn:()=>openRanking(C.id)},{l:"↺ Jogar de novo",silent:true,fn:()=>openCase(C.id,true)},{l:"← Outros casos",silent:true,fn:()=>{renderHome();go("home")}}]);return}
  const opts=C.hub.filter(h=>!S.visited.has(h.id)&&(h.req||[]).every(ok)).map(h=>({l:h.l,to:h.id}));
  if(S.ev.length>=C.minEv)opts.push({l:"🕵️ Já sei quem foi.",main:true,fn:startAccusation});
  if(!opts.length)opts.push({l:"Examine a cena ou interrogue os suspeitos 👆",silent:true,fn:()=>{}});
  renderChoices("ch-main",opts);
}
$("btnScene").onclick=()=>go("scene");
$("turbo").onclick=()=>{turbo=!turbo;$("turbo").classList.toggle("on",turbo);toast(turbo?"Mensagens rápidas: ligado":"Mensagens rápidas: desligado")};

/* ---------- interrogatório ---------- */
$("btnInter").onclick=()=>{renderContacts();go("contacts")};
function renderContacts(){
  const list=$("contactList");list.innerHTML="";

    const left=s.q.filter(q=>!S.asked[k].has(q.l)).length;

    b.onclick=()=>openInter(k);list.appendChild(b);
  });
}
function openInter(k){
  interWho=k;const s=C.sus[k];
  $("interAv").innerHTML=face(k);$("interName").textContent=s.n;
  const c=$("chat-inter");c.innerHTML="";
  if(!S.logs[k].childNodes.length)S.logs[k].innerHTML='<div class="msg note">Toque na foto do perfil pra ver melhor. Detalhes importam.</div>';
  c.appendChild(S.logs[k]);go("inter");scroll(c);renderInter();
}
$("interAv").onclick=()=>{const w=el("div",null,`<div class="avatar" style="width:220px;height:220px;margin:0 auto">${face(interWho)}</div>`);const b=el("button","choice");b.textContent="Fechar foto";b.style.textAlign="center";b.onclick=closeSheet;openSheet(C.sus[interWho].n,[w,b])};
function renderInter(){
  const s=C.sus[interWho];

  opts.push({l:"🧷 Mostrar uma pista",cls:"alt",silent:true,fn:confront});
  renderChoices("ch-inter",opts);
}
async function say(lines){for(const l of lines){await typing("chat-inter","st-inter",tms(l));bubble("chat-inter","in",l);await wait(110)}}
async function answer(q){
  busy=true;$("ch-inter").innerHTML="";S.asked[interWho].add(q.l);
  await say(q.a);
  if(q.ev){if(q.pre)await say([q.pre]);await typing("chat-inter","st-inter",450);add("chat-inter",evCard(q.ev));gain(q.ev)}
  speed=1;busy=false;renderInter();
}
function confront(){
  if(!S.ev.length){toast("Você ainda não tem pistas");return}
  openSheet("Mostrar qual pista?",S.ev.map(id=>{const c=evCard(id,"pick");c.onclick=()=>{closeSheet();showEv(id)};return c}));
}
async function showEv(id){
  busy=true;$("ch-inter").innerHTML="";
  bubble("chat-inter","me","Explica isso aqui: "+C.ev[id].t.replace(/^\S+\s/,""));
  const s=C.sus[interWho],r=s.react[id];
  await say(Array.isArray(r)?r:r?r.a:s.def);
  if(r&&r.gain){await wait(300);gain(r.gain);add("chat-inter",evCard(r.gain))}

}

const hint=t=>el("p","hint",t);
function options(list,fn){return list.map(([k,l])=>{const b=el("button","choice");b.textContent=l;b.onclick=()=>fn(k,l);return b})}
async function startAccusation(){
  busy=true;$("ch-main").innerHTML="";

  ACC={};stepWho();

function stepWho(){
  const grid=el("div","sus");
  C.acc.who.forEach(([k,n,d])=>{const b=el("button",null,`<div class="avatar">${face(k)}</div>${n}<small>${d}</small>`);b.onclick=()=>{ACC.who=k;ACC.whoN=n;stepHow()};grid.appendChild(b)});
  openSheet("Quem foi?",[hint("1 de 4 · o culpado"),grid]);
}
function stepHow(){openSheet("Como fez?",[hint("2 de 4 · o método"),...options(C.acc.how,(k,l)=>{ACC.how=k;ACC.howL=l;stepWhy()})])}
function stepWhy(){openSheet("Por que fez?",[hint("3 de 4 · o motivo"),...options(C.acc.why,(k,l)=>{ACC.why=k;ACC.whyL=l;stepProof()})])}
function stepProof(){openSheet("Qual é a prova decisiva?",[hint("4 de 4 · a prova"),...S.ev.map(id=>{const c=evCard(id,"pick");c.onclick=()=>{ACC.ev=id;closeSheet();resolve()};return c})])}
function endCard(type,title,txt){add("chat-main",el("div","end "+type,`<b>${title}</b><p>${txt}</p>`))}
async function contactSays(lines){for(const l of lines){await typing("chat-main","st-main",tms(l));bubble("chat-main","in",l);await wait(110)}}
async function resolve(){
  const A=C.acc,{who,how,why,ev}=ACC;busy=true;$("ch-main").innerHTML="";
  bubble("chat-main","me",`Foi ${who===C.contact.k?"você":ACC.whoN}. ${ACC.howL}. Motivo: ${ACC.whyL.toLowerCase()}. A prova: ${C.ev[ev].t.replace(/^\S+\s/,"")}.`);
  if(who!==A.answer.who){
    S.penalty+=60000;
    await contactSays(A.wrong[who]);
    endCard("bad","Acusação errada · +1 min",A.wrongHint);
    busy=false;renderChoices("ch-main",[{l:"Deixa eu rever as pistas",fn:async()=>{busy=true;await contactSays(["Tá, sem pressa."]);busy=false;renderHub()}}]);return;
  }
  const okHow=how===A.answer.how,okWhy=why===A.answer.why,okEv=A.strong.includes(ev);
  const score=1+okHow+okWhy+okEv,fb=[];
  if(!okHow)fb.push("o método não bate: "+A.hintHow);
  if(!okWhy)fb.push("o motivo não bate: "+A.hintWhy);
  if(!okEv)fb.push(A.medium.includes(ev)?"a prova aponta pra pessoa, mas ainda dá pra ela negar":"essa prova não liga a pessoa ao crime");
  if(score<=2){
    S.penalty+=60000;
    await contactSays(["Pode até ser… mas do jeito que você contou, ninguém vai acreditar."]);
    endCard("mid",`Suspeita certa · ${score}/4 · +1 min`,"Mas "+fb.join("; ")+".");
    busy=false;renderChoices("ch-main",[{l:"Refazer a acusação",silent:true,fn:startAccusation},{l:"Vou investigar mais",fn:async()=>{busy=true;await contactSays(["Ok. Tô aqui."]);busy=false;renderHub()}}]);return;
  }
  await contactSays(A.ending);
  const st=score===4?3:2,time=S.elapsed+S.penalty;
  S.ended=true;
  endCard("ok",`${A.endTitle||"Caso resolvido"} · ${score}/4 ${stars(st)}`,`Tempo: ${fmt(time)} · Pistas: ${S.ev.length}/${Object.keys(C.ev).length} · Cena: ${S.found.size}/${hsCount()}.`+(fb.length?" Quase perfeito: "+fb[0]+".":" Dedução perfeita."));
  const best=record(C.id,st,time,score);
  if(best)toast("Novo recorde! 🏆");
  busy=false;renderHub();save();
}

/* =====================================================================
   PLACAR — local (este aparelho) e online (quem abrir o link)
===================================================================== */
const better=(a,b)=>!b||a.stars>b.stars||(a.stars===b.stars&&a.time<b.time);
function record(caseId,st,time,score){
  const all=store.get("dp-scores",{});all[player]=all[player]||{};
  const cur=all[player][caseId],nw={stars:st,time,score,at:Date.now()};
  const isBest=better(nw,cur);
  if(isBest){all[player][caseId]=nw;store.set("dp-scores",all);pushOnline(caseId,nw)}
  return isBest;
}
let DB=null,USER=null,UID=null,ONLINE=[],NAMES={},onlineReadOnly=false;
async function initOnline(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    DB=db;USER=user;UID=id;
    if(typeof user.can==="function"&&(await user.can("data.write"))===false)onlineReadOnly=true;
    DB.collection("scores").onSnapshot(async snap=>{
      ONLINE=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));
      try{const ps=await USER.profiles(ONLINE.map(r=>r.id));ONLINE.forEach(r=>NAMES[r.id]=(ps[r.id]&&ps[r.id].name)||"")}catch(e){}
      // envia recordes locais que ainda não estão online
      const mine=ONLINE.find(r=>r.id===UID),local=(store.get("dp-scores",{})[player])||{};
      Object.entries(local).forEach(([cid,v])=>{if(better(v,mine&&mine.cases&&mine.cases[cid]))pushOnline(cid,v)});
      if(!$("ranking").classList.contains("off"))renderRanking();
    },()=>{});
    $("segOnline").disabled=false;
  }catch(e){}
}
let pushing=Promise.resolve();
function pushOnline(caseId,v){
  if(!DB||onlineReadOnly)return;
  pushing=pushing.then(async()=>{
    try{
      const ref=DB.doc("scores/"+UID),snap=await ref.get();
      const cases=Object.assign({},snap.exists&&snap.data().cases||{});
      if(!better(v,cases[caseId]))return;
      cases[caseId]={stars:v.stars,time:v.time,score:v.score};
      await ref.set({cases,nick:player||""});
    }catch(e){if(e&&e.code==="invalid_argument")onlineReadOnly=true}
  });
}

/* ---------- ranking ---------- */
let rankMode="local",rankCase="all";
function openRanking(cid){rankCase=cid||"all";renderRanking();go("ranking")}
$("btnRank").onclick=()=>openRanking("all");
$("segLocal").onclick=()=>{rankMode="local";renderRanking()};
$("segOnline").onclick=()=>{rankMode="online";renderRanking()};
function rows(){
  if(rankMode==="local"){const all=store.get("dp-scores",{});return Object.entries(all).map(([n,cs])=>({name:n,me:n===player,cases:cs}))}
  return ONLINE.map(r=>({name:NAMES[r.id]||r.nick||"Jogador",me:r.id===UID,cases:r.cases||{}}));
}
function renderRanking(){
  $("segLocal").classList.toggle("sel",rankMode==="local");$("segOnline").classList.toggle("sel",rankMode==="online");
  $("segOnline").disabled=!DB;
  const chips=$("rankChips");chips.innerHTML="";
  [["all","🏅 Geral"],...CASES.map(c=>[c.id,c.emoji+" "+c.title])].forEach(([k,l])=>{const b=el("button",k===rankCase?"sel":"");b.textContent=l;b.onclick=()=>{rankCase=k;renderRanking()};chips.appendChild(b)});
  let list=rows().map(r=>{
    if(rankCase==="all"){const v=Object.values(r.cases);return{...r,stars:v.reduce((a,x)=>a+x.stars,0),time:v.reduce((a,x)=>a+x.time,0),n:v.length}}
    const v=r.cases[rankCase];return v?{...r,stars:v.stars,time:v.time,n:1,score:v.score}:null;
  }).filter(r=>r&&r.n>0);
  list.sort((a,b)=>b.stars-a.stars||a.time-b.time);
  const box=$("rankList");box.innerHTML="";
  if(rankMode==="online"&&!DB){box.appendChild(el("div","empty","Ranking online indisponível aqui. Abra o jogo pelo link do Claude, com login."));return}
  if(!list.length){box.appendChild(el("div","empty",rankCase==="all"?"Ninguém resolveu um caso ainda. Seja o primeiro!":"Ninguém resolveu este caso ainda."));return}
  list.forEach((r,i)=>{
    const medal=["🥇","🥈","🥉"][i]||(i+1);
    const sub=rankCase==="all"?`${r.n}/${CASES.length} casos`:`${r.score}/4 na dedução`;
    const row=el("div","row"+(r.me?" me":""),`<div class="pos">${medal}</div><div class="nm"><b></b><small>${sub}</small></div><div class="st">⭐ ${r.stars}<small>${fmt(r.time)}</small></div>`);
    row.querySelector("b").textContent=r.name+(r.me?" (você)":"");
    box.appendChild(row);
  });
}

/* ---------- início ---------- */
function renderHome(){
  $("playerLbl").textContent="Jogador: "+(player||"—");
  const all=(store.get("dp-scores",{})[player])||{};
  const list=$("caseList");list.innerHTML="";
  CASES.forEach(c=>{
    const best=all[c.id],sv=store.get(`dp-save-${player}-${c.id}`,null);
    const status=best?`<span class="tag ok">${stars(best.stars)} ${fmt(best.time)}</span>`:sv&&!sv.ended?`<span class="tag go">Em andamento</span>`:`<span class="tag">Novo</span>`;
    const b=el("button","card",`<div class="ico">${c.emoji}</div><div class="info"><b>${c.title}</b><small>${c.tagline}</small><div class="meta"><span>${"●".repeat(c.diff)}${"○".repeat(3-c.diff)} ${["","fácil","médio","difícil"][c.diff]}</span>${status}</div></div>`);
    b.onclick=()=>{
      if(sv&&sv.ended){openCase(c.id,true);return}
      openCase(c.id,false);
    };
    list.appendChild(b);
  });
}
function askPlayer(first){
  const inp=el("input","field");inp.placeholder="Seu nome ou apelido";inp.maxLength=20;inp.value=player||"";
  const known=Object.keys(store.get("dp-scores",{})).filter(n=>n!==player);
  const chips=known.length?el("div","chips"):null;
  if(chips){chips.style.padding="0";known.forEach(n=>{const b=el("button");b.textContent=n;b.onclick=()=>{inp.value=n;done()};chips.appendChild(b)})}
  const btn=el("button","choice main");btn.textContent="Começar a investigar";btn.style.textAlign="center";
  const done=()=>{const v=inp.value.trim();if(!v){inp.focus();return}player=v;store.set("dp-player",v);closeSheet();renderHome()};
  btn.onclick=done;inp.onkeydown=e=>{if(e.key==="Enter")done()};
  const els=[hint(first?"Pra entrar no ranking. Cada pessoa no mesmo celular pode ter o seu.":"Quem está jogando agora?"),inp];
  if(chips)els.push(hint("Ou continue como:"),chips);
  els.push(btn);
  openSheet(first?"Quem é o detetive?":"Trocar jogador",els);
  if(first)$("closeSheet").style.visibility="hidden";
  setTimeout(()=>inp.focus(),300);
  const restore=()=>{$("closeSheet").style.visibility=""};btn.addEventListener("click",restore);
}
$("btnPlayer").onclick=()=>askPlayer(false);

renderHome();go("home");
if(!player)askPlayer(true);
initOnline();
</script>
